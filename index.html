<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Solar Guide - Solar Calculator</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'solar-blue': '#0f172a',
                        'solar-blue-light': '#1e293b',
                        'solar-yellow': '#fbbf24',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-solar-blue text-slate-100 min-h-screen antialiased overflow-x-hidden p-4 md:p-8" id="body-tag">
    
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <nav class="flex flex-col sm:flex-row justify-between items-center gap-6 mb-8 md:mb-12">
            <div class="flex flex-col items-center sm:items-start gap-2">
                <div class="bg-solar-yellow p-3 rounded-2xl shadow-lg">
                    <i data-lucide="sun" class="text-solar-blue w-8 h-8 md:w-9 md:h-9"></i>
                </div>
                <div class="text-center sm:text-start">
                    <h1 id="main-title" class="text-2xl md:text-3xl font-black tracking-tight text-white drop-shadow-md">Solar Guide</h1>
                    <p id="main-subtitle" class="text-slate-400 text-xs md:text-sm font-medium mt-1">Complete Solar Estimator</p>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="toggleLanguage()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-solar-yellow/10 border border-solar-yellow/30 text-solar-yellow px-5 py-2.5 rounded-full hover:bg-solar-yellow hover:text-solar-blue transition-all font-medium text-sm">
                    <i data-lucide="languages" class="w-5 h-5"></i>
                    <span id="lang-btn-text">اردو</span>
                </button>
            </div>
        </nav>

        <main class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-16">
            <!-- Inputs -->
            <div class="bg-solar-blue-light/40 backdrop-blur-md rounded-3xl p-6 md:p-8 border border-slate-700/30 shadow-xl">
                <div class="flex items-center gap-3 mb-8">
                    <i data-lucide="calculator" class="text-solar-yellow w-6 h-6"></i>
                    <h2 id="calc-heading" class="text-xl font-bold">Solar Calculator</h2>
                </div>

                <div class="space-y-6">
                    <div>
                        <label id="label-wattage" class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-3 block">Panel Wattage (W)</label>
                        <div class="relative">
                            <input type="number" id="panel-watts" value="585" oninput="calculate()" class="w-full bg-solar-blue/80 border-2 border-slate-700/50 rounded-2xl px-6 py-5 text-xl font-black text-solar-yellow focus:outline-none focus:border-solar-yellow transition-all shadow-inner">
                            <span id="label-default-panel" class="absolute top-1/2 -translate-y-1/2 right-6 text-[10px] md:text-xs text-slate-500 font-bold bg-solar-blue-light px-2.5 py-1.5 rounded-lg border border-slate-700">585W recommended</span>
                        </div>
                    </div>

                    <div id="appliance-container" class="space-y-5">
                        <!-- Appliances generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="space-y-6 flex flex-col">
                <div class="bg-solar-yellow rounded-[2.5rem] p-8 md:p-12 text-solar-blue shadow-2xl relative overflow-hidden flex flex-col justify-center min-h-[500px] lg:flex-1 border-4 border-white/20">
                    <div class="relative z-10 h-full flex flex-col">
                        <h2 id="result-heading" class="text-3xl font-black flex items-center gap-3 mb-10">
                            <i data-lucide="check-circle-2" class="w-8 h-8"></i>
                            Your Results
                        </h2>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10">
                            <div class="bg-white/15 p-6 rounded-3xl border border-white/10 shadow-sm">
                                <p id="label-run-load" class="text-solar-blue/60 text-[10px] font-black uppercase tracking-widest mb-2">Running Load</p>
                                <p class="text-4xl font-black"><span id="res-running">0</span><span class="text-xl ml-1 font-bold">W</span></p>
                            </div>
                            <div class="bg-white/15 p-6 rounded-3xl border border-white/10 shadow-sm">
                                <p id="label-peak-load" class="text-solar-blue/60 text-[10px] font-black uppercase tracking-widest mb-2">Peak Load</p>
                                <p class="text-4xl font-black"><span id="res-peak">0</span><span class="text-xl ml-1 font-bold">W</span></p>
                            </div>
                            <div class="bg-white/15 p-6 rounded-3xl border border-white/10 shadow-sm">
                                <p id="label-inv-size" class="text-solar-blue/60 text-[10px] font-black uppercase tracking-widest mb-2">Recommended Inverter</p>
                                <p class="text-4xl font-black"><span id="res-inverter">0</span><span class="text-xl ml-1 font-bold">W+</span></p>
                            </div>
                            <div class="bg-solar-blue text-white p-6 rounded-3xl shadow-xl">
                                <p id="label-panel-count" class="text-white/60 text-[10px] font-black uppercase tracking-widest mb-2">Panels Required</p>
                                <div class="flex items-baseline gap-2 text-solar-yellow">
                                    <span id="res-panels" class="text-6xl font-black">0</span>
                                    <span class="text-lg font-black opacity-80 text-white">x <span id="res-panel-w">585</span>W</span>
                                </div>
                            </div>
                        </div>

                        <button onclick="shareWhatsApp()" class="mt-auto w-full bg-solar-blue text-white py-6 rounded-[2rem] font-black text-xl flex items-center justify-center gap-4 hover:bg-slate-800 transition-all shadow-lg active:translate-y-1">
                            <div class="bg-green-500 p-2.5 rounded-2xl">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.588-5.946 0-6.556 5.332-11.891 11.891-11.891 3.181 0 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.481 8.403 0 6.556-5.332 11.891-11.891 11.891-2.011 0-3.98-.51-5.725-1.481l-6.268 1.699zm6.136-4.22c1.554.912 3.208 1.481 4.939 1.481 5.481 0 9.943-4.462 9.943-9.943 0-2.651-1.033-5.144-2.908-7.019-1.875-1.875-4.373-2.907-7.035-2.907-5.481 0-9.943 4.462-9.943 9.943 0 1.867.525 3.69 1.507 5.258l-1.002 3.664 3.791-.986zm11.303-6.812c-.301-.15-1.777-.877-2.051-.976-.275-.1-.475-.15-.675.15-.2.3-.775.976-.95 1.176-.175.2-.35.225-.651.075-.3-.15-1.266-.467-2.411-1.485-.891-.795-1.492-1.775-1.667-2.076-.175-.301-.019-.464.131-.613.136-.134.301-.35.451-.526.15-.175.2-.3.3-.5.1-.2.05-.375-.025-.525-.075-.15-.675-1.625-.925-2.225-.244-.588-.492-.507-.675-.516-.174-.01-.374-.012-.574-.012-.2 0-.525.075-.8.375-.275.3-1.05 1.026-1.05 2.503 0 1.478 1.075 2.903 1.225 3.102.15.2 2.115 3.227 5.125 4.526.716.31 1.274.495 1.71.633.721.23 1.376.197 1.894.12.578-.087 1.777-.726 2.026-1.427.25-.7.25-1.3.175-1.426-.075-.125-.275-.2-.575-.35z"/></svg>
                            </div>
                            <span id="share-btn-text">Share on WhatsApp</span>
                        </button>
                    </div>
                    <div class="absolute top-0 right-0 p-8 opacity-10 pointer-events-none">
                        <i data-lucide="sun" class="w-56 h-56"></i>
                    </div>
                </div>

                <div class="bg-solar-blue-light/40 backdrop-blur-md rounded-3xl p-6 border border-slate-700/30 flex items-center gap-5">
                    <div class="bg-solar-yellow/20 p-4 rounded-2xl shrink-0">
                        <i data-lucide="battery" class="text-solar-yellow w-7 h-7 md:w-8 md:h-8"></i>
                    </div>
                    <div>
                        <p id="label-battery" class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Battery Recommendation</p>
                        <p id="res-battery" class="text-lg md:text-xl font-bold text-white">---</p>
                    </div>
                </div>

                <div class="bg-solar-blue-light/40 backdrop-blur-md rounded-3xl p-6 md:p-8 border border-slate-700/30">
                    <h3 id="tech-heading" class="text-solar-yellow font-bold text-sm mb-6 flex items-center gap-3">
                        <div class="p-1.5 bg-solar-yellow/10 rounded-lg"><i data-lucide="settings" class="w-4 h-4"></i></div>
                        Technical Advice
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="p-4 bg-solar-blue/60 rounded-2xl border border-slate-800/80">
                            <p id="label-wire" class="text-[10px] text-slate-500 uppercase font-black tracking-widest mb-2">Recommended Wire</p>
                            <p id="res-wire" class="text-base font-bold text-slate-100">---</p>
                        </div>
                        <div class="p-4 bg-solar-blue/60 rounded-2xl border border-slate-800/80">
                            <p id="label-breaker" class="text-[10px] text-slate-500 uppercase font-black tracking-widest mb-2">Recommended Breaker</p>
                            <p id="res-breaker" class="text-base font-bold text-slate-100">---</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Icons & JS -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
</body>
</html>
